<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TechPOS · Gestión</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --brand:#2563eb;--brand2:#06b6d4;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;
  --side:#0b1220;--side-ink:#cbd5e1;--soft:#eef2ff;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a0f1a;--card:#121a2b;--ink:#e6ecf7;--muted:#8b9ab5;--line:#22304a;--soft:#17223a;--side:#060a13;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12.5px}.right{text-align:right}.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;color:#fff;font-weight:700;font-size:17px}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-style:normal}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--side-ink)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:linear-gradient(135deg,var(--brand),#1d4ed8);color:#fff}
.who{margin-top:auto;padding:12px 8px 4px;font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
.who button{margin-top:8px;width:100%}
.main{padding:22px 26px 90px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:23px}
.save-state{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi span{color:var(--muted);font-size:13px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
/* controls */
button{cursor:pointer}
.btn{border:0;background:var(--brand);color:#fff;padding:9px 15px;border-radius:10px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.soft{background:var(--soft);color:var(--brand)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
.field{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:120px}.row>.auto{flex:0 0 auto;min-width:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;flex:1;min-width:150px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.pill.gray{background:#e2e8f0;color:#334155}
@media (prefers-color-scheme:dark){.pill.ok{background:#12351f;color:#86efac}.pill.warn{background:#3a2c0c;color:#fcd34d}.pill.bad{background:#3b1414;color:#fca5a5}.pill.gray{background:#25324a;color:#cbd5e1}}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.acts{white-space:nowrap;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:99px;white-space:nowrap;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--brand)}
.tile .ph{aspect-ratio:1/1;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:36px;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile b{font-size:14px;line-height:1.25}
.tile .pr{color:var(--brand);font-weight:700}
.cart{position:sticky;top:14px}
.line-item{border-bottom:1px dashed var(--line);padding:10px 0}
.line-item:last-child{border-bottom:0}
.li-top{display:flex;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.sn{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:8px;padding:2px 4px 2px 8px;margin:3px 4px 0 0;font-size:12px}
.sn button{all:unset;cursor:pointer;color:var(--danger);padding:0 4px;font-weight:700}
.total-row{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:10px}
.fab{position:fixed;right:16px;bottom:78px;z-index:20;box-shadow:0 8px 24px rgba(37,99,235,.4);display:none}
/* modal */
dialog{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(2,6,23,.55)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mb{padding:16px 18px;overflow:auto;max-height:calc(92vh - 130px)}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;color:var(--muted)}
.vrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.vrow .row>*{min-width:90px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--danger)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1000px 500px at 80% -10%,rgba(6,182,212,.25),transparent),radial-gradient(900px 500px at 0% 110%,rgba(37,99,235,.28),transparent),var(--side)}
.auth .card{width:min(420px,100%)}
.users-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.users-pick button{border:1px solid var(--line);background:var(--card);padding:14px 8px;border-radius:12px;font-weight:600}
.users-pick button.on{border-color:var(--brand);background:var(--soft)}
.bars{display:flex;align-items:end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;font-size:11px;color:var(--muted)}
.bars span{display:block;width:100%;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:8px 8px 0 0;min-height:2px}
/* receipt */
.receipt{font-size:13px}
.receipt h3{text-align:center}
.receipt table td,.receipt table th{padding:4px 6px;font-size:12.5px;background:transparent;position:static}
.sep{border-top:1px dashed var(--muted);margin:8px 0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:30;overflow-x:auto;gap:2px}
  .brand,.who{display:none}
  .nav{display:flex;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;width:auto;min-width:62px;text-align:center;align-items:center}
  .main{padding:14px 14px 100px}
  .pos{grid-template-columns:1fr}
  .cart{position:static}
  .fab{display:block}
  .mobile-who{display:flex!important}
}
.mobile-who{display:none;align-items:center;gap:8px}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;width:100%;color:#000}
}
</style>
</head>
<body>

<div id="auth" class="auth hidden"></div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><i>⚡</i><span id="brandName">TechPOS</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><div id="whoLabel"></div><button class="btn line sm" data-act="logout" style="color:#cbd5e1;border-color:rgba(255,255,255,.2)">Cerrar sesión</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="title"></h1>
      <div class="mobile-who"><span id="whoMobile" class="small muted"></span><button class="btn line sm" data-act="logout">Salir</button></div>
      <span class="save-state" id="saveState">💾 Local</span>
    </div>
    <div id="page"></div>
  </main>
  <button class="btn fab" id="fab" data-act="goCart"></button>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const nowISO=()=>new Date().toISOString();
const fmtD=i=>i?new Date(i).toLocaleDateString('es-CO'):'—';
const fmtDT=i=>i?new Date(i).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—';
const pad=n=>String(n).padStart(2,'0');
const dayKey=i=>{const d=new Date(i);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const todayKey=()=>dayKey(new Date());
const addDays=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString()};
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),err?4200:2400)}
function openDlg(html,wide){const d=$('#dlg');d.className=wide?'wide':'';d.innerHTML=html;if(!d.open)d.showModal()}
function closeDlg(){const d=$('#dlg');if(d.open)d.close();d.innerHTML='';ui.serialPick=null}
const mh=(t)=>`<div class="mh"><h3>${t}</h3><button class="x" type="button" data-act="closeDlg">×</button></div>`;

/* ============ Almacenamiento (IndexedDB por colección) ============ */
const IDB_NAME='techposLocal',COLS=['products','units','sales','cash','accounts','expenses','claims','stockLog','users'];
const db={};COLS.forEach(c=>db[c]=[]);
let settings={key:'settings',storeName:'TechPOS',lowStock:3,cash:{open:false,sessionId:null},saleSeq:0};
let idbP=null;
function idb(){
  if(!idbP)idbP=new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{COLS.forEach(c=>r.result.createObjectStore(c,{keyPath:'id'}));r.result.createObjectStore('meta',{keyPath:'key'})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return idbP;
}
const getAll=(d,s)=>new Promise((res,rej)=>{const q=d.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function loadAll(){
  const d=await idb();
  for(const c of COLS)db[c]=await getAll(d,c);
  const m=await getAll(d,'meta');const s=m.find(x=>x.key==='settings');
  if(s)settings=Object.assign(settings,s);
  if(!settings.cash)settings.cash={open:false,sessionId:null};
}
let pending=[],writeQ=Promise.resolve();
const put=(c,o)=>{pending.push(['put',c,o]);return o};
const del=(c,id)=>{pending.push(['del',c,id])};
const putSettings=()=>pending.push(['put','meta',settings]);
function setState(t,c){const e=$('#saveState');if(e){e.textContent=t;e.style.color=c||''}}
function save(){
  const ops=pending.map(o=>o[0]==='put'?['put',o[1],JSON.parse(JSON.stringify(o[2]))]:o);pending=[];
  if(ops.length){
    setState('💾 Guardando…','#d97706');
    writeQ=writeQ.then(async()=>{
      const d=await idb();
      await new Promise((res,rej)=>{
        const t=d.transaction([...new Set(ops.map(o=>o[1]))],'readwrite');
        ops.forEach(([k,c,v])=>{const s=t.objectStore(c);k==='put'?s.put(v):s.delete(v)});
        t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
      });
      setState('💾 Guardado en este dispositivo','#16a34a');
    }).catch(e=>{console.error(e);setState('⚠ Error al guardar','#dc2626');toast('No se pudo guardar: '+(e&&e.message||e),true)});
  }
  render();
}

/* ============ Seguridad (PIN con PBKDF2 + salt) ============ */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPin(pin,salt){
  salt=salt||hex(crypto.getRandomValues(new Uint8Array(16)));
  if(crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:150000,hash:'SHA-256'},k,256);
    return {alg:'pbkdf2',salt,hash:hex(b)};
  }
  let h=5381;for(const ch of salt+pin)h=((h<<5)+h+ch.charCodeAt(0))>>>0;
  return {alg:'weak',salt,hash:h.toString(16)};
}
async function checkPin(pin,rec){const h=await hashPin(pin,rec.salt);return h.alg===rec.alg&&h.hash===rec.hash}
const validPin=p=>/^\d{4,8}$/.test(p);

/* ============ Estado de UI ============ */
let me=null;
const ui={page:'dashboard',q:'',cat:'',cart:[],discount:0,pay:[],serialPick:null,
  from:dayKey(addDays(nowISO(),-29)),to:todayKey(),status:'',loginUser:null,fails:0,lockUntil:0};
const PAGES=[
 ['dashboard','Inicio','🏠',1],['pos','Vender','🛒',0],['products','Productos','📦',1],['inventory','Inventario','🧮',0],
 ['sales','Ventas','🧾',0],['warranties','Garantías','🛡️',0],['cash','Caja','💵',0],['accounts','Cuentas','📒',1],
 ['expenses','Gastos','💸',1],['reports','Reportes','📊',1],['users','Usuarios','👥',1],['settings','Ajustes','⚙️',1]];
const isAdmin=()=>me&&me.role==='admin';
const can=p=>{const x=PAGES.find(a=>a[0]===p);return x&&(!x[3]||isAdmin())};
function needAdmin(a){if(!isAdmin()){toast('Solo un administrador puede '+a,true);return false}return true}

/* ============ Dominio: productos / stock ============ */
const CATS=['Celulares','Accesorios','Parlantes y audio','TV y video','Cargadores y cables','Computación','Gaming','Otros'];
function getV(vid){for(const p of db.products){const v=p.variants.find(x=>x.id===vid);if(v)return {p,v}}return null}
function availUnits(vid){return db.units.filter(u=>u.variantId===vid&&u.status==='available')}
function stockOf(p,v){return p.tracking==='serial'?availUnits(v.id).length:num(v.stock)}
function totalStock(p){return sum(p.variants,v=>stockOf(p,v))}
function inCartQty(vid){return sum(ui.cart.filter(l=>l.variantId===vid),l=>l.qty)}
function vLabel(v){return v.label&&v.label!=='Único'?v.label:''}
function logStock(p,v,delta,reason,extra){put('stockLog',Object.assign({id:uid(),at:nowISO(),productId:p.id,variantId:v.id,name:p.name,label:vLabel(v),delta,reason,by:me?me.name:''},extra||{}))}
function codeTaken(val,exceptVid){
  if(!val)return false;const n=norm(val);
  return db.products.some(p=>p.variants.some(v=>v.id!==exceptVid&&(norm(v.sku)===n||norm(v.barcode)===n)));
}
function serialTaken(s){return db.units.some(u=>norm(u.serial)===norm(s))}
function findByCode(code){
  const n=norm(code.trim());if(!n)return null;
  const u=db.units.find(x=>norm(x.serial)===n);
  if(u){const g=getV(u.variantId);if(g)return {...g,unit:u}}
  for(const p of db.products)for(const v of p.variants)if(norm(v.barcode)===n||norm(v.sku)===n)return {p,v};
  return null;
}

/* ============ Caja ============ */
const cashOpen=()=>!!settings.cash.open;
function sessionMoves(){return db.cash.filter(m=>m.sessionId===settings.cash.sessionId)}
function cashBalance(){return sum(sessionMoves(),m=>m.type==='open'||m.type==='in'?m.amount:m.type==='out'?-m.amount:0)}
function cashPost(type,amount,desc,ref){
  put('cash',{id:uid(),at:nowISO(),sessionId:settings.cash.sessionId,type,amount:num(amount),desc,by:me?me.name:'',ref:ref||null});
}
function needCash(){if(!cashOpen()){toast('Abre la caja primero para registrar movimientos en efectivo.',true);return false}return true}

/* ============ Render principal ============ */
function render(){
  if(!me)return;
  const hadFocus=document.activeElement&&document.activeElement.id==='posQ';
  $('#nav').innerHTML=PAGES.filter(p=>can(p[0])).map(p=>`<button data-act="nav" data-id="${p[0]}" class="${ui.page===p[0]?'on':''}"><span>${p[2]}</span><span>${p[1]}</span></button>`).join('');
  $('#brandName').textContent=settings.storeName||'TechPOS';
  $('#whoLabel').innerHTML=`<b>${esc(me.name)}</b><br><span class="muted">${me.role==='admin'?'Administrador':'Empleado'}</span>`;
  $('#whoMobile').textContent=me.name;
  const pg=PAGES.find(p=>p[0]===ui.page);$('#title').textContent=pg?pg[1]:'';
  const fn=R[ui.page];$('#page').innerHTML=fn?fn():'';
  refreshList();updateFab();
  if(hadFocus){const q=$('#posQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function updateFab(){
  const n=sum(ui.cart,l=>l.qty);const fab=$('#fab');
  fab.style.display=(n>0&&ui.page==='pos'&&matchMedia('(max-width:900px)').matches)?'block':'none';
  fab.textContent='🛒 Ver venta · '+n+' · '+money(cartTotals().total);
}
function refreshList(){const f=L[ui.page];const el=$('#list');if(f&&el)el.innerHTML=f()}

/* ============ POS ============ */
function cartTotals(){
  const subtotal=sum(ui.cart,l=>l.price*l.qty);
  const discount=Math.min(Math.max(0,num(ui.discount)),subtotal);
  return {subtotal,discount,total:subtotal-discount};
}
function posResults(){
  const q=norm(ui.q);
  return db.products.filter(p=>p.active!==false&&(!ui.cat||p.category===ui.cat)&&
    (!q||norm(p.name+' '+p.brand+' '+p.category).includes(q)||p.variants.some(v=>norm(v.sku+' '+v.barcode+' '+v.label).includes(q))))
    .filter(p=>totalStock(p)>0);
}
function posTiles(){
  const rs=posResults();
  if(!rs.length)return '<div class="empty">No hay productos con stock para esta búsqueda.</div>';
  return `<div class="tiles">`+rs.map(p=>{
    const prices=p.variants.map(v=>v.price);const mn=Math.min(...prices),mx=Math.max(...prices);
    return `<button class="tile" data-act="addProduct" data-id="${p.id}"><div class="ph">${p.image?`<img src="${p.image}" alt="">`:icon(p.category)}</div><b>${esc(p.name)}</b><span class="small muted">${esc(p.brand||'')}${p.variants.length>1?' · '+p.variants.length+' variantes':''}</span><span class="pr">${mn===mx?money(mn):'desde '+money(mn)}</span><span class="small muted">${totalStock(p)} disp.${p.tracking==='serial'?' · IMEI/serial':''}</span></button>`}).join('')+`</div>`;
}
function icon(c){return ({'Celulares':'📱','Parlantes y audio':'🔊','TV y video':'📺','Cargadores y cables':'🔌','Computación':'💻','Gaming':'🎮','Accesorios':'🎧'})[c]||'📦'}

  return ui.cart.map((l,i)=>`<div class="line-item"><div class="li-top"><div><b>${esc(l.name)}</b>${l.label?` <span class="pill gray">${esc(l.label)}</span>`:''}<br>

    ${l.tracking==='serial'?`<div>${l.serials.map(s=>`<span class="sn mono">${esc(s.serial)}<button data-act="rmSerial" data-id="${i}" data-s="${s.id}">×</button></span>`).join('')}<br><button class="btn soft sm" data-act="morSerial" data-id="${l.variantId}" style="margin-top:6px">+ unidad</button></div>`
    :`<div class="qty"><button data-act="qty" data-id="${i}" data-d="-1">−</button><b>${l.qty}</b><button data-act="qty" data-id="${i}" data-d="1">+</button></div>`}</div>`).join('');
}
function addLine(p,v,unit){
  let l=ui.cart.find(x=>x.variantId===v.id);
  if(!l){l={variantId:v.id,productId:p.id,name:p.name,label:vLabel(v),price:v.price,cost:v.cost,qty:0,tracking:p.tracking,serials:[],warrantyDays:num(p.warrantyDays)};ui.cart.push(l)}
  if(p.tracking==='serial'){
    if(!unit)return;
    if(l.serials.some(s=>s.id===unit.id))return toast('Esa unidad ya está en la venta.',true);
    l.serials.push({id:unit.id,serial:unit.serial});l.qty=l.serials.length;
  }else{
    if(inCartQty(v.id)+1>stockOf(p,v)){if(!l.qty)ui.cart.pop();return toast('No hay más stock disponible.',true)}
    l.qty++;
  }
  renderPos();
}
function renderPos(){const c=$('#cartBox');if(c){c.innerHTML=cartHTML();$('#cartTotals').innerHTML=totalsHTML()}render()}

function serialList(){
  const sp=ui.serialPick;if(!sp)return '';
  const inCart=new Set(ui.cart.flatMap(l=>l.serials.map(s=>s.id)));
  const us=availUnits(sp.vid).filter(u=>!inCart.has(u.id)&&norm(u.serial).includes(norm(sp.q)));
  if(!us.length)return '<div class="empty">Sin unidades disponibles.</div>';
  return us.slice(0,60).map(u=>`<button class="btn line" style="display:block;width:100%;text-align:left;margin-bottom:6px" data-act="pickUnit" data-id="${u.id}"><span class="mono">${esc(u.serial)}</span></button>`).join('');
}

const METHODS=['Efectivo','Transferencia','Tarjeta','Crédito / fiado'];
function payRows(){
  return ui.pay.map((p,i)=>`<div class="row payrow" style="margin-bottom:8px"><select class="pm" data-on="payM" data-id="${i}">${METHODS.map(m=>`<option ${m===p.method?'selected':''}>${m}</option>`).join('')}</select><input class="pa" type="number" min="0" value="${p.amount}" data-on="payA" data-id="${i}">${ui.pay.length>1?`<button type="button" class="btn line auto" data-act="rmPay" data-id="${i}">×</button>`:''}</div>`).join('');
}
function updatePayInfo(){
  const t=cartTotals(),paid=sum(ui.pay,p=>num(p.amount)),diff=t.total-paid;
  const el=$('#payInfo');if(!el)return;
  el.innerHTML=diff===0?'<span class="pill ok">Pagos completos</span>':diff>0?`<span class="pill warn">Faltan ${money(diff)}</span>`:`<span class="pill bad">Sobran ${money(-diff)}</span>`;
  const cashAmt=sum(ui.pay.filter(p=>p.method==='Efectivo'),p=>num(p.amount));
  const cb=$('#cashBox');if(cb)cb.style.display=cashAmt>0?'':'none';
  const r=$('[name=recv]');if(r&&$('#change')){const v=num(r.value);$('#change').textContent=v>0?(v>=cashAmt?'Cambio a devolver: '+money(v-cashAmt):'Falta recibir '+money(cashAmt-v)):''}
}
function nextSaleNumber(){settings.saleSeq=(settings.saleSeq||0)+1;putSettings();return settings.saleSeq}
function finishSale(f){
  const t=cartTotals(),fd=new FormData(f);
  const pays=ui.pay.filter(p=>num(p.amount)>0).map(p=>({method:p.method,amount:num(p.amount)}));
  if(sum(pays,p=>p.amount)!==t.total)return toast('Los pagos deben sumar exactamente el total.',true);
  const cname=String(fd.get('cname')||'').trim();
  const credit=sum(pays.filter(p=>p.method==='Crédito / fiado'),p=>p.amount);
  if(credit>0&&!cname)return toast('Para vender a crédito escribe el nombre del cliente.',true);
  const cashAmt=sum(pays.filter(p=>p.method==='Efectivo'),p=>p.amount);
  if(cashAmt>0&&!needCash())return;
  // revalidar stock y unidades
  for(const l of ui.cart){
    const g=getV(l.variantId);if(!g)return toast('Un producto ya no existe: '+l.name,true);
    if(l.tracking==='serial'){if(l.serials.some(s=>{const u=db.units.find(x=>x.id===s.id);return !u||u.status!=='available'}))return toast('Una unidad ya no está disponible: '+l.name,true)}
    else if(l.qty>stockOf(g.p,g.v))return toast('Stock insuficiente: '+l.name,true);
  }
  const at=nowISO(),saleId=uid(),number=nextSaleNumber();
  const items=ui.cart.map(l=>({productId:l.productId,variantId:l.variantId,name:l.name,label:l.label,price:l.price,cost:num(l.cost),qty:l.qty,
    serials:l.serials.map(s=>s.serial),unitIds:l.serials.map(s=>s.id),warrantyDays:l.warrantyDays,warrantyUntil:l.warrantyDays>0?addDays(at,l.warrantyDays):null}));
  ui.cart.forEach(l=>{
    const g=getV(l.variantId);
    if(l.tracking==='serial')l.serials.forEach(s=>{const u=db.units.find(x=>x.id===s.id);u.status='sold';u.saleId=saleId;put('units',u)});
    else{g.v.stock=num(g.v.stock)-l.qty}
    put('products',g.p);
    logStock(g.p,g.v,-l.qty,'Venta #'+number,{saleId});
  });
  const sale={id:saleId,number,createdAt:at,items,subtotal:t.subtotal,discount:t.discount,total:t.total,payments:pays,
    customer:{name:cname,phone:String(fd.get('cphone')||'').trim(),doc:String(fd.get('cdoc')||'').trim()},seller:me.name,sellerId:me.id,status:'completed'};
  db.sales.unshift(sale);put('sales',sale);
  if(cashAmt>0)cashPost('in',cashAmt,'Venta #'+number,{kind:'sale',id:saleId});
  if(credit>0){const a={id:uid(),type:'receivable',name:cname,phone:sale.customer.phone,desc:'Venta #'+number,total:credit,paid:0,payments:[],saleId,createdAt:at};db.accounts.unshift(a);put('accounts',a)}
  ui.cart=[];ui.discount=0;
  save();
  openDlg(mh('Venta #'+number+' registrada ✅')+`<div class="mb">${receiptHTML(sale)}</div><div class="mf"><button class="btn line" data-act="print">🖨 Imprimir</button><button class="btn" data-act="closeDlg">Nueva venta</button></div>`);
}
function receiptHTML(s){
  const wl=s.items.filter(i=>i.warrantyUntil);
  return `<div class="receipt"><h3>${esc(settings.storeName)}</h3><div class="small right" style="text-align:center">Venta #${s.number} · ${fmtDT(s.createdAt)}${s.status==='voided'?' · <b style="color:#dc2626">ANULADA</b>':''}</div><div class="sep"></div>
  <div class="small">Cliente: ${esc(s.customer.name||'Mostrador')}${s.customer.doc?' · '+esc(s.customer.doc):''}${s.customer.phone?' · '+esc(s.customer.phone):''}<br>Atendió: ${esc(s.seller)}</div><div class="sep"></div>
  <table>${s.items.map(i=>`<tr><td>${i.qty} × ${esc(i.name)}${i.label?' ('+esc(i.label)+')':''}${i.serials.length?`<br><span class="mono">${i.serials.map(esc).join('<br>')}</span>`:''}</td><td class="right nowrap">${money(i.price*i.qty)}</td></tr>`).join('')}</table>
  <div class="sep"></div><table><tr><td>Subtotal</td><td class="right">${money(s.subtotal)}</td></tr>${s.discount?`<tr><td>Descuento</td><td class="right">-${money(s.discount)}</td></tr>`:''}<tr><td><b>TOTAL</b></td><td class="right"><b>${money(s.total)}</b></td></tr>
  ${s.payments.map(p=>`<tr><td class="muted">${esc(p.method)}</td><td class="right muted">${money(p.amount)}</td></tr>`).join('')}</table>
  ${wl.length?`<div class="sep"></div><div class="small"><b>Garantía:</b><br>${wl.map(i=>`${esc(i.name)}: hasta ${fmtD(i.warrantyUntil)} (${i.warrantyDays} días)`).join('<br>')}<br>La garantía no cubre golpes, humedad ni manipulación.</div>`:''}
  <div class="sep"></div><div class="small" style="text-align:center">¡Gracias por tu compra!</div></div>`;
}
function voidSale(id){
  if(!needAdmin('anular ventas'))return;
  const s=db.sales.find(x=>x.id===id);if(!s||s.status==='voided')return;
  const acc=db.accounts.find(a=>a.saleId===id);
  if(acc&&acc.paid>0)return toast('Esta venta tiene abonos en cuentas por cobrar; gestiona la devolución manualmente.',true);
  const cashAmt=sum(s.payments.filter(p=>p.method==='Efectivo'),p=>p.amount);
  if(cashAmt>0&&!needCash())return;
  const reason=prompt('Motivo de la anulación (obligatorio):');if(!reason||!reason.trim())return;
  s.items.forEach(i=>{
    const g=getV(i.variantId);if(!g)return;
    if(g.p.tracking==='serial')(i.unitIds||[]).forEach(uid_=>{const u=db.units.find(x=>x.id===uid_);if(u){u.status='available';delete u.saleId;put('units',u)}});
    else g.v.stock=num(g.v.stock)+i.qty;
    put('products',g.p);logStock(g.p,g.v,i.qty,'Anulación venta #'+s.number);
  });
  if(cashAmt>0)cashPost('out',cashAmt,'Anulación venta #'+s.number,{kind:'void',id:id});
  if(acc){del('accounts',acc.id);db.accounts=db.accounts.filter(a=>a.id!==acc.id)}
  Object.assign(s,{status:'voided',voidedAt:nowISO(),voidReason:reason.trim(),voidedBy:me.name});put('sales',s);
  closeDlg();save();toast('Venta anulada y stock devuelto.');
}

function lowItems(){
  const out=[];db.products.filter(p=>p.active!==false).forEach(p=>p.variants.forEach(v=>{const s=stockOf(p,v),m=num(p.minStock||settings.lowStock);if(s<=m)out.push({p,v,s})}));return out;
}

function syncTracking(){const s=$('[name=tracking]');if(!s)return;$$('.stk').forEach(e=>e.style.display=s.value==='serial'?'none':'')}
function compress(file,max=420){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}
async function saveProduct(f){
  if(!needAdmin('guardar productos'))return;
  const fd=new FormData(f),id=f.dataset.id,old=id?db.products.find(p=>p.id===id):null;
  const name=String(fd.get('name')).trim();if(!name)return toast('Falta el nombre.',true);
  const tracking=old&&db.units.some(u=>u.productId===old.id)?old.tracking:fd.get('tracking');
  const rows=$$('.vrow',f);if(!rows.length)return toast('Agrega al menos una variante.',true);
  const seen=new Set(),variants=[];
  for(const r of rows){
    const g=k=>$('[data-f='+k+']',r).value.trim(),vid=r.dataset.vid;
    const sku=g('sku'),bc=g('barcode');
    for(const c of [sku,bc])if(c){if(seen.has(norm(c))||codeTaken(c,vid||'-'))return toast('SKU/código repetido: '+c,true);seen.add(norm(c))}
    const price=num(g('price'));if(price<=0&&!confirm('Una variante tiene precio 0. ¿Continuar?'))return;
    const ex=vid&&old?old.variants.find(v=>v.id===vid):null;
    variants.push({id:vid||uid(),label:g('label')||'Único',sku,barcode:bc,price,cost:num(g('cost')),stock:ex?ex.stock:(tracking==='serial'?0:Math.max(0,Math.floor(num($('[data-f=stock]',r).value)))),_new:!vid});
  }
  if(old){const gone=old.variants.filter(v=>!variants.some(x=>x.id===v.id));
    for(const v of gone)if(stockOf(old,v)>0)return toast('No puedes quitar "'+v.label+'" porque tiene stock.',true)}
  let image=old?old.image:'';const file=fd.get('img');
  if(file&&file.size){try{image=await compress(file)}catch(e){toast('No se pudo leer la imagen.',true)}}
  const p=old||{id:uid(),active:true};
  Object.assign(p,{name,brand:String(fd.get('brand')).trim(),category:String(fd.get('category')).trim()||'Otros',tracking,warrantyDays:Math.max(0,Math.floor(num(fd.get('warrantyDays')))),minStock:Math.max(0,Math.floor(num(fd.get('minStock')))),image,variants:variants.map(({_new,...v})=>v)});
  if(!old)db.products.unshift(p);
  variants.filter(v=>v._new&&tracking!=='serial'&&v.stock>0).forEach(v=>logStock(p,v,v.stock,'Stock inicial'));
  put('products',p);closeDlg();save();toast('Producto guardado.');
}
function delProduct(id){
  if(!needAdmin('eliminar productos'))return;
  const p=db.products.find(x=>x.id===id);if(!p)return;
  if(db.sales.some(s=>s.items.some(i=>i.productId===id)))return toast('Tiene ventas registradas: mejor archívalo.',true);
  if(!confirm('¿Eliminar "'+p.name+'" y su stock?'))return;
  db.units.filter(u=>u.productId===id).forEach(u=>del('units',u.id));db.units=db.units.filter(u=>u.productId!==id);
  del('products',id);db.products=db.products.filter(x=>x.id!==id);save();
}

function receiveModal(vid){
  const g=getV(vid);const serial=g.p.tracking==='serial';
  openDlg(mh('Ingresar mercancía · '+esc(g.p.name)+' '+esc(vLabel(g.v)))+`<form data-submit="doReceive" data-id="${vid}"><div class="mb">

function doReceive(f){
  if(!needAdmin('ingresar mercancía'))return;
  const g=getV(f.dataset.id),fd=new FormData(f),note=String(fd.get('note')||'').trim();
  if(fd.get('cost')!==''&&num(fd.get('cost'))>=0)g.v.cost=num(fd.get('cost'));
  if(g.p.tracking==='serial'){
    const list=String(fd.get('serials')).split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    if(!list.length)return toast('Escribe al menos un serial.',true);
    const dup=list.find((s,i)=>list.findIndex(x=>norm(x)===norm(s))!==i);if(dup)return toast('Serial repetido en la lista: '+dup,true);
    const ex=list.find(serialTaken);if(ex)return toast('Ese serial ya existe en el sistema: '+ex,true);
    list.forEach(s=>put('units',(db.units[db.units.push({id:uid(),productId:g.p.id,variantId:g.v.id,serial:s,status:'available',addedAt:nowISO(),cost:g.v.cost})-1])));
    logStock(g.p,g.v,list.length,'Ingreso'+(note?' · '+note:''),{serials:list});
  }else{
    const q=Math.floor(num(fd.get('qty')));if(q<1)return toast('Cantidad inválida.',true);
    g.v.stock=num(g.v.stock)+q;logStock(g.p,g.v,q,'Ingreso'+(note?' · '+note:''));
  }
  put('products',g.p);closeDlg();save();toast('Mercancía ingresada.');
}

function warrantyRows(){
  const rows=[];
  completed().forEach(s=>s.items.forEach((i,idx)=>{
    if(!i.warrantyUntil)return;
    const units=i.serials.length?i.serials:[''];
    units.forEach(sn=>rows.push({s,i,sn,until:i.warrantyUntil}));
  }));
  return rows.sort((a,b)=>b.s.createdAt.localeCompare(a.s.createdAt));
}
function wStatus(r){
  const open=db.claims.some(c=>c.saleId===r.s.id&&c.serial===r.sn&&c.productId===r.i.productId&&(c.status==='Abierto'||c.status==='En revisión'));
  if(open)return ['En reclamo','bad'];
  const d=(new Date(r.until)-new Date())/864e5;
  return d<0?['Vencida','gray']:d<=30?['Por vencer','warn']:['Vigente','ok'];
}

  const ss=completed().filter(s=>inRange(s.createdAt)),ex=db.expenses.filter(e=>inRange(e.at));
  const total=sum(ss,s=>s.total),profit=sum(ss,saleProfit),exp=sum(ex,e=>e.amount);
  const byM={};ss.forEach(s=>s.payments.forEach(p=>byM[p.method]=(byM[p.method]||0)+p.amount));
  const prod={};ss.forEach(s=>s.items.forEach(i=>{const k=i.name+(i.label?' '+i.label:'');prod[k]=prod[k]||{q:0,t:0,u:0};prod[k].q+=i.qty;prod[k].t+=i.price*i.qty;prod[k].u+=(i.price-i.cost)*i.qty}));
  const cat={};ss.forEach(s=>s.items.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);const c=p?p.category:'Otros';cat[c]=(cat[c]||0)+i.price*i.qty}));
  const sel={};ss.forEach(s=>{sel[s.seller]=sel[s.seller]||{n:0,t:0};sel[s.seller].n++;sel[s.seller].t+=s.total});
  const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td class="empty" colspan="9">Sin datos</td></tr>'}</tbody></table></div>`;
  return `${rangeBar('<div class="auto"><button class="btn line" data-act="exportSales">⬇ CSV ventas</button></div>')}
  <div class="grid kpis"><div class="card kpi"><span>Ventas</span><b>${money(total)}</b></div><div class="card kpi"><span># transacciones</span><b>${ss.length}</b></div><div class="card kpi"><span>Ticket promedio</span><b>${money(ss.length?total/ss.length:0)}</b></div><div class="card kpi"><span>Utilidad bruta</span><b>${money(profit)}</b></div><div class="card kpi"><span>Gastos</span><b>${money(exp)}</b></div><div class="card kpi"><span>Utilidad neta</span><b style="color:${profit-exp>=0?'var(--ok)':'var(--danger)'}">${money(profit-exp)}</b></div></div>
  <div class="grid cols2"><div><h3 style="margin-bottom:8px">Por método de pago</h3>${tbl(['Método','Monto'],Object.entries(byM).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join(''))}</div>
  <div><h3 style="margin-bottom:8px">Por categoría</h3>${tbl(['Categoría','Vendido'],Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join(''))}</div>
  <div><h3 style="margin-bottom:8px">Por vendedor</h3>${tbl(['Vendedor','Ventas','Total'],Object.entries(sel).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.t)}</td></tr>`).join(''))}</div></div>
  <h3 style="margin:18px 0 8px">Productos más vendidos</h3>${tbl(['Producto','Unidades','Vendido','Utilidad'],Object.entries(prod).sort((a,b)=>b[1].q-a[1].q).slice(0,15).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.q}</td><td>${money(v.t)}</td><td>${money(v.u)}</td></tr>`).join(''))}`;
};

  newAccount(){openDlg(mh('Cuenta manual')+`<form data-submit="saveAccount"><div class="mb"><div class="field"><label>Tipo</label><select name="t"><option value="receivable">Por cobrar (cliente)</option><option value="payable">Por pagar (proveedor)</option></select></div><div class="field"><label>Nombre *</label><input name="n" required></div><div class="field"><label>Teléfono</label><input name="p"></div><div class="field"><label>Detalle</label><input name="d"></div><div class="field"><label>Valor total</label><input name="v" type="number" min="1" required></div></div><div class="mf"><button class="btn">Guardar</button></div></form>`)},
  payAcc(id){const a=db.accounts.find(x=>x.id===id);openDlg(mh((a.type==='receivable'?'Abono de ':'Pago a ')+esc(a.name))+`<form data-submit="payAccount" data-id="${id}"><div class="mb"><p>Saldo: <b>${money(a.total-a.paid)}</b></p><div class="field"><label>Monto</label><input name="a" type="number" min="1" max="${a.total-a.paid}" value="${a.total-a.paid}" required></div><div class="field"><label>Método</label><select name="m">${['Efectivo','Transferencia','Tarjeta'].map(m=>`<option>${m}</option>`).join('')}</select></div></div><div class="mf"><button class="btn ok">Registrar</button></div></form>`)},
  histAcc(id){const a=db.accounts.find(x=>x.id===id);openDlg(mh('Historial · '+esc(a.name))+`<div class="mb">${a.payments.length?`<table>${a.payments.map(p=>`<tr><td>${fmtDT(p.at)}</td><td>${esc(p.method)}</td><td class="right">${money(p.amount)}</td><td class="small muted">${esc(p.by)}</td></tr>`).join('')}</table>`:'<div class="empty">Sin abonos.</div>'}</div>`)},

function download(name,mime,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

const S={
  finishSale,saveProduct,doReceive,doAdjust,saveClaim,
  updClaim(f){const c=db.claims.find(x=>x.id===f.dataset.id),fd=new FormData(f);c.status=fd.get('status');c.notes=String(fd.get('notes')).trim();put('claims',c);closeDlg();save()},
  openCash(f){settings.cash={open:true,sessionId:uid()};putSettings();cashPost('open',num(new FormData(f).get('a')),'Apertura de caja');closeDlg();save()},
  cashMove(f){const fd=new FormData(f);cashPost(f.dataset.t,num(fd.get('a')),String(fd.get('d')).trim());closeDlg();save()},
  closeCash(f){const counted=num(new FormData(f).get('a')),exp=cashBalance();
    put('cash',{id:uid(),at:nowISO(),sessionId:settings.cash.sessionId,type:'close',amount:counted,expected:exp,diff:counted-exp,desc:'Cierre de caja',by:me.name});
    settings.cash={open:false,sessionId:null};putSettings();closeDlg();save();toast('Caja cerrada. Diferencia: '+money(counted-exp))},
  saveAccount(f){const fd=new FormData(f),a={id:uid(),type:fd.get('t'),name:String(fd.get('n')).trim(),phone:String(fd.get('p')).trim(),desc:String(fd.get('d')).trim()||'Manual',total:num(fd.get('v')),paid:0,payments:[],saleId:null,createdAt:nowISO()};db.accounts.unshift(a);put('accounts',a);closeDlg();save()},
  payAccount(f){const a=db.accounts.find(x=>x.id===f.dataset.id),fd=new FormData(f),amt=Math.min(num(fd.get('a')),a.total-a.paid),m=fd.get('m');
    if(amt<=0)return toast('Monto inválido.',true);if(m==='Efectivo'&&!needCash())return;
    a.paid+=amt;a.payments.push({at:nowISO(),amount:amt,method:m,by:me.name});put('accounts',a);
    if(m==='Efectivo')cashPost(a.type==='receivable'?'in':'out',amt,(a.type==='receivable'?'Abono de ':'Pago a ')+a.name,{kind:'account',id:a.id});
    closeDlg();save()},
  saveExpense(f){const fd=new FormData(f),m=fd.get('m'),amt=num(fd.get('a'));if(m==='Efectivo'&&!needCash())return;
    const e={id:uid(),at:nowISO(),category:fd.get('c'),desc:String(fd.get('d')).trim(),amount:amt,method:m,by:me.name};db.expenses.unshift(e);put('expenses',e);
    if(m==='Efectivo')cashPost('out',amt,'Gasto: '+e.desc,{kind:'expense',id:e.id});closeDlg();save()},
  async saveUser(f){const fd=new FormData(f),n=String(fd.get('n')).trim(),p=String(fd.get('p'));
    if(!validPin(p))return toast('El PIN debe tener de 4 a 8 dígitos.',true);if(db.users.some(u=>norm(u.name)===norm(n)))return toast('Ya existe ese nombre.',true);

  async savePin(f){const p=String(new FormData(f).get('p'));if(!validPin(p))return toast('El PIN debe tener de 4 a 8 dígitos.',true);const u=db.users.find(x=>x.id===f.dataset.id);u.pin=await hashPin(p);put('users',u);closeDlg();save();toast('PIN actualizado.')},
  saveSettings(f){const fd=new FormData(f);settings.storeName=String(fd.get('storeName')).trim()||'TechPOS';settings.lowStock=Math.max(0,num(fd.get('lowStock')));putSettings();save();toast('Guardado.')}

const H={
  q(el){ui.q=el.value;refreshList()},
  posQ(el){ui.q=el.value;refreshList()},
  from(el){ui.from=el.value;ui.page==='reports'?render():refreshList()},

  discount(el){ui.discount=Math.max(0,num(el.value));const t=cartTotals();$('#cartTotals').querySelector('.total-row span:last-child').textContent=money(t.total)},
  serialQ(el){ui.serialPick.q=el.value;$('#serialList').innerHTML=serialList()},
  payM(el){ui.pay[+el.dataset.id].method=el.value;updatePayInfo()},
  payA(el){ui.pay[+el.dataset.id].amount=el.value;updatePayInfo()},
  recv(){updatePayInfo()},
  trackSel(){syncTracking()},
  importFile(el){const file=el.files[0];el.value='';if(!file||!needAdmin('importar'))return;const r=new FileReader();r.onload=async()=>{try{
    const d=JSON.parse(r.result);if(d.app!=='techpos'||!d.db)throw new Error('Archivo de respaldo no válido.');
    if(!confirm('Esto REEMPLAZARÁ todos los datos actuales. ¿Continuar?'))return;
    const x=await idb();await new Promise((res,rej)=>{const t=x.transaction([...COLS,'meta'],'readwrite');COLS.forEach(c=>{t.objectStore(c).clear();(d.db[c]||[]).forEach(o=>t.objectStore(c).put(o))});t.objectStore('meta').put(Object.assign({key:'settings'},d.settings,{key:'settings'}));t.oncomplete=res;t.onerror=()=>rej(t.error)});
    alert('Respaldo restaurado. La app se reiniciará.');location.reload()}catch(e){toast('No se pudo importar: '+e.message,true)}};r.readAsText(file)}
};

  const a=$('#auth');a.classList.remove('hidden');$('#app').classList.add('hidden');
  if(!db.users.length){
    a.innerHTML=`<div class="card"><h2>👋 Bienvenido a TechPOS</h2><p class="muted">Crea el administrador de tu tienda de tecnología.</p><form data-submit="setup"><div class="field"><label>Nombre del negocio</label><input name="store" required value="${esc(settings.storeName)}"></div><div class="field"><label>Tu nombre</label><input name="name" required></div><div class="field"><label>PIN (4 a 8 dígitos)</label><input name="pin" type="password" inputmode="numeric" required></div><div class="field"><label>Confirmar PIN</label><input name="pin2" type="password" inputmode="numeric" required></div><button class="btn" style="width:100%">Comenzar</button></form></div>`;
    return;
  }
  a.innerHTML=`<div class="card"><h2>⚡ ${esc(settings.storeName)}</h2><p class="muted">¿Quién va a ingresar?</p><div class="users-pick">${db.users.map(u=>`<button data-act="pickUser" data-id="${u.id}" class="${ui.loginUser===u.id?'on':''}">${u.role==='admin'?'🛡️':'🙂'}<br>${esc(u.name)}</button>`).join('')}</div>
  <form data-submit="login" class="${ui.loginUser?'':'hidden'}"><div class="field"><label>PIN</label><input name="pin" type="password" inputmode="numeric" autocomplete="off" required></div><button class="btn" style="width:100%">Entrar</button></form></div>`;
  if(ui.loginUser)setTimeout(()=>{const i=$('#auth [name=pin]');i&&i.focus()},30);
}
A.pickUser=id=>{ui.loginUser=id;showAuth()};
S.setup=async f=>{
  const fd=new FormData(f),p=String(fd.get('pin'));
  if(!validPin(p))return toast('El PIN debe tener de 4 a 8 dígitos.',true);if(p!==fd.get('pin2'))return toast('Los PIN no coinciden.',true);
  settings.storeName=String(fd.get('store')).trim()||'TechPOS';putSettings();
  const u={id:uid(),name:String(fd.get('name')).trim(),role:'admin',pin:await hashPin(p)};db.users.push(u);put('users',u);
  await Promise.resolve();save();enter(u);
};
S.login=async f=>{
  if(Date.now()<ui.lockUntil)return toast('Demasiados intentos. Espera '+Math.ceil((ui.lockUntil-Date.now())/1000)+' s.',true);
  const u=db.users.find(x=>x.id===ui.loginUser);if(!u)return;
  if(await checkPin(String(new FormData(f).get('pin')),u.pin)){ui.fails=0;enter(u)}
  else{ui.fails++;f.reset();if(ui.fails>=5){ui.lockUntil=Date.now()+30000;ui.fails=0;toast('Bloqueado 30 segundos.',true)}else toast('PIN incorrecto.',true)}
};
function enter(u){
  me={id:u.id,name:u.name,role:u.role};$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');
  ui.page=can('dashboard')?'dashboard':'pos';ui.q='';ui.status='';render();
}

/* ============ Datos de ejemplo ============ */
function seed(){
  if(!needAdmin('cargar datos de ejemplo'))return;
  if(db.products.length&&!confirm('Ya tienes productos. ¿Agregar los de ejemplo de todos modos?'))return;
  const rnd=()=>'35'+String(Math.floor(Math.random()*1e13)).padStart(13,'0');
  const mk=(name,brand,category,tracking,wd,vars)=>{
    const p={id:uid(),name,brand,category,tracking,warrantyDays:wd,minStock:2,active:true,image:'',variants:vars.map(([label,price,cost,stock])=>({id:uid(),label,sku:'',barcode:'',price,cost,stock:tracking==='serial'?0:stock}))};
    p.variants.forEach((v,i)=>{v.sku=(brand.slice(0,3)+'-'+name.replace(/\W/g,'').slice(0,4)+'-'+(i+1)).toUpperCase()+Math.floor(Math.random()*90+10);
      if(tracking==='serial')for(let k=0;k<vars[i][3];k++){const un={id:uid(),productId:p.id,variantId:v.id,serial:rnd(),status:'available',addedAt:nowISO(),cost:v.cost};db.units.push(un);put('units',un)}
      else if(vars[i][3])logStock(p,v,vars[i][3],'Stock inicial')});
    db.products.push(p);put('products',p);return p};
  mk('iPhone 15','Apple','Celulares','serial',365,[['Negro 128GB',3399000,2900000,4],['Azul 256GB',3899000,3350000,3]]);
  mk('Galaxy A55 5G','Samsung','Celulares','serial',365,[['Azul 256GB',1599000,1300000,5]]);
  mk('Redmi Note 13','Xiaomi','Celulares','serial',365,[['Negro 128GB',749000,590000,6],['Verde 256GB',849000,680000,3]]);
  mk('Smart TV 50" 4K','LG','TV y video','serial',365,[['50 pulgadas',1699000,1350000,3]]);
  mk('Smart TV 65" QLED','Samsung','TV y video','serial',365,[['65 pulgadas',3299000,2700000,2]]);
  mk('Parlante Flip 6','JBL','Parlantes y audio','none',180,[['Negro',459000,350000,8],['Azul',459000,350000,6]]);
  mk('Barra de sonido 2.1','Sony','Parlantes y audio','serial',365,[['Negro',699000,540000,3]]);
  mk('Audífonos AirPods Pro 2','Apple','Accesorios','serial',365,[['Blanco',929000,780000,4]]);
  mk('Cargador rápido 20W USB-C','Genérico','Cargadores y cables','none',90,[['Blanco',39000,18000,30]]);
  mk('Cable USB-C a Lightning 1m','Genérico','Cargadores y cables','none',90,[['1 metro',29000,11000,40]]);
  mk('Vidrio templado','Genérico','Accesorios','none',0,[['iPhone 15',25000,6000,25],['Galaxy A55',25000,6000,20]]);
  mk('Forro antigolpes','Genérico','Accesorios','none',0,[['Transparente',35000,12000,3]]);
  mk('Power bank 20000mAh','Xiaomi','Accesorios','none',180,[['Negro',129000,85000,10]]);
  mk('Control PS5 DualSense','Sony','Gaming','none',180,[['Blanco',289000,220000,5]]);
  save();toast('Datos de ejemplo cargados.');
}

/* ============ Inicio ============ */
(async function init(){
  try{
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    await loadAll();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="padding:30px;font-family:sans-serif"><h2>⚠ Almacenamiento no disponible</h2><p>Este navegador no permite guardar datos locales (¿modo privado?). Abre la app en una ventana normal.</p></div>';return;
  }
  showAuth();
})();
</script>
